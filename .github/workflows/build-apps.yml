name: Construire les applications

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1) Enregistrer chaque mot/phrase avec une VOIX NATIVE de chaque langue (gratuit, une seule fois grâce au cache)
  voix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache/restore@v4
        with:
          path: www/audio
          key: voix-${{ github.run_id }}
          restore-keys: voix-
      - run: pip install edge-tts
      - run: python scripts/make_audio.py
      - uses: actions/cache/save@v4      # on garde les enregistrements même si un essai échoue
        if: always()
        with:
          path: www/audio
          key: voix-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        with: { name: voix, path: www/audio }

  windows:
    needs: voix
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: voix, path: www/audio }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: python scripts/build.py
      - run: npm install
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/BIBILEARN-Windows-Setup.exe
            dist/BIBILEARN-Windows-portable.exe

  linux:
    needs: voix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: voix, path: www/audio }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: python3 scripts/build.py
      - run: npm install
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/BIBILEARN-Linux.AppImage
            dist/BIBILEARN-Linux.deb

  android:
    needs: voix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: voix, path: www/audio }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: python3 scripts/build.py
      - name: Installer Capacitor (+ voix natives Android)
        run: npm install --no-save @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor-community/text-to-speech@latest
      - run: npx cap add android
      - name: Icône BIBILEARN
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in android/app/src/main/res/mipmap-*dpi; do
            cp www/icons/icon-192.png "$d/ic_launcher.png"
            cp www/icons/icon-192.png "$d/ic_launcher_round.png"
          done
      - run: npx cap sync android
      - name: Construire l'APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk BIBILEARN-Android.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: BIBILEARN-Android.apk }

  # Version web (iPhone, iPad, tous navigateurs) avec les voix natives
  web:
    needs: voix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: voix, path: www/audio }
      - run: python3 scripts/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: www }
      - id: d
        uses: actions/deploy-pages@v4

  release:
    needs: [ windows, linux, android, web ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: windows, path: files }
      - uses: actions/download-artifact@v4
        with: { name: linux, path: files }
      - uses: actions/download-artifact@v4
        with: { name: android, path: files }
      - run: ls -la files
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.${{ github.run_number }}
          name: BIBILEARN 1.2.${{ github.run_number }} — voix natives, niveaux A1 → C2
          make_latest: true
          body: |
            Nouveautés : voix natives pour les 15 langues (intégrées, hors ligne), niveaux A1 Débutant → C2 Natif, grammaire, dictée, textes à trous, jeu d'association.

            Téléchargements directs :
            - Windows 11 (installation) : BIBILEARN-Windows-Setup.exe
            - Windows 11 (sans installation) : BIBILEARN-Windows-portable.exe
            - Linux : BIBILEARN-Linux.AppImage ou BIBILEARN-Linux.deb
            - Android : BIBILEARN-Android.apk
            - iPhone / iPad : https://bianca23-cloud.github.io/BIBILEARN/ (Safari → Partager → Sur l'écran d'accueil)
          files: files/*
