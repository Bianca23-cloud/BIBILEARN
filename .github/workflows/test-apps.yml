name: Tester les applications

# Se lance tout seul après chaque fabrication réussie (ou à la main).
on:
  workflow_run:
    workflows: [ "Construire les applications" ]
    types: [ completed ]
  workflow_dispatch:

permissions:
  contents: write

env:
  REL: https://github.com/${{ github.repository }}/releases/latest/download
  WEB: https://bianca23-cloud.github.io/BIBILEARN/

jobs:
  web:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: La version web répond et contient BIBILEARN
        run: |
          for i in 1 2 3 4 5 6; do curl -fsSL "$WEB" -o page.html && break; sleep 30; done
          grep -q "BIBILEARN" page.html && echo "OK web" > web.txt
          for f in BIBILEARN-Windows-Setup.exe BIBILEARN-Windows-portable.exe BIBILEARN-Linux.AppImage BIBILEARN-Linux.deb BIBILEARN-Android.apk; do
            code=$(curl -sIL -o /dev/null -w "%{http_code}" "$REL/$f"); echo "$f -> HTTP $code" | tee -a web.txt
            test "$code" = "200"
          done
      - uses: actions/upload-artifact@v4
        with: { name: res-web, path: web.txt }

  android:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - name: Activer l'accélération KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - run: curl -fsSL "$REL/BIBILEARN-Android.apk" -o app.apk && ls -la app.apk
      - name: Installer et lancer l'APK dans un téléphone Android virtuel
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r app.apk
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell cmd connectivity airplane-mode enable || true
            adb shell monkey -p io.github.bianca23cloud.bibilearn -c android.intent.category.LAUNCHER 1
            sleep 25
            adb exec-out screencap -p > android.png
            adb shell pidof io.github.bianca23cloud.bibilearn > android.txt
            echo "OK android SANS INTERNET (mode avion, processus $(cat android.txt))" | tee android.txt
      - uses: actions/upload-artifact@v4
        with: { name: res-android, path: "android.*" }

  iphone:
    needs: web
    runs-on: macos-latest
    steps:
      - name: Ouvrir BIBILEARN dans Safari sur un iPhone virtuel (simulateur iOS)
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          NAME=$(xcrun simctl list devices available | grep "$UDID" | sed 's/^ *//')
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl openurl "$UDID" "$WEB"
          sleep 40
          xcrun simctl io "$UDID" screenshot iphone.png
          echo "OK iPhone : $NAME" | tee iphone.txt
      - uses: actions/upload-artifact@v4
        with: { name: res-iphone, path: "iphone.*" }

  windows:
    needs: web
    runs-on: windows-latest
    steps:
      - name: Télécharger et lancer BIBILEARN sur Windows
        shell: pwsh
        run: |
          Invoke-WebRequest "$env:REL/BIBILEARN-Windows-portable.exe" -OutFile app.exe
          Start-Process .\app.exe
          Start-Sleep -Seconds 45
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("windows.png")
          $p = Get-Process | Where-Object { $_.ProcessName -like "BIBILEARN*" }
          if (-not $p) { throw "BIBILEARN ne tourne pas" }
          "OK windows (fichiers locaux, aucun serveur) : $($p.Count) processus BIBILEARN, fenetre '$(($p | Where-Object MainWindowTitle | Select-Object -First 1).MainWindowTitle)'" | Tee-Object windows.txt
      - uses: actions/upload-artifact@v4
        with: { name: res-windows, path: "windows.*" }

  rapport:
    needs: [ web, android, iphone, windows ]
    if: ${{ always() && needs.web.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: res, merge-multiple: true }
      - name: Publier les captures dans la branche « verification »
        run: |
          cd res
          {
            echo "# Vérification automatique de BIBILEARN"
            echo; echo "Date : $(date -u '+%Y-%m-%d %H:%M UTC') — run ${{ github.run_id }}"; echo
            for t in web windows android iphone; do echo "## $t"; echo '```'; cat $t.txt 2>/dev/null || echo "ÉCHEC"; echo '```'; [ -f $t.png ] && echo "![$t]($t.png)"; echo; done
          } > README.md
          git init -q && git checkout -q -b verification
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "Vérification ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" verification
